name: C controller tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build simulator
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc \
            src/main.c src/hvac_controller.c -o hvac_sim

      - name: Build unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/test_controller.c src/hvac_controller.c -o test_controller

      - name: Run unit tests
        run: ./test_controller
